<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#dfe8e9"><title>두 사람의 가을 · Miniature Journey</title><link rel="stylesheet" href="style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><div id="world" aria-label="회전·확대 가능한 3차원 여행 도시"><div id="loading">MINIATURE JOURNEY<span>작은 도시를 준비하고 있어요.</span></div><div id="labels"></div><div id="fallback" hidden></div></div>
<section id="trip" class="glass"><p class="eyebrow">AUTUMN / 2026 · 12 DAYS</p><div class="dayHeading"><strong id="dayNumber">02</strong><div><p id="cityName"></p><h1 id="dayTitle"></h1></div></div><p id="routeText"></p></section>
<nav id="placeChips" aria-label="오늘의 장소"></nav>
<div id="explore" class="glass"><p>이 지역 둘러보기 · 장소를 누르면 카메라 이동</p><div id="nearby"></div></div>
<nav id="toolbar" aria-label="여행 도구"><button id="tourButton">▶ 자동 투어</button><button id="guideButton">여행 안내</button><button id="printButton">인쇄</button><button id="infoButton" aria-pressed="true">정보</button><button id="modelButton" aria-pressed="false">모형만 보기</button></nav>
<aside id="panel" class="glass"><div class="panelTabs"><button id="placeTab" aria-pressed="true">장소·특징</button><button id="scheduleTab" aria-pressed="false">오늘 일정</button><button id="closePanel" aria-label="정보 닫기">×</button></div><div id="panelBody" tabindex="0"></div></aside>
<section id="mini" class="glass"><div><b>오늘의 방문 순서</b><button id="foldMap" aria-expanded="true">접기 −</button></div><div id="miniBody"><svg id="routeMap" viewBox="0 0 280 155" role="img" aria-label="실제 지도가 아닌 방문 순서 개념도"></svg><a id="mapLink" target="_blank" rel="noopener noreferrer">선택 장소 · 실제 지도 ↗</a><small>순서선·모형 위치이며 실제 길찾기 경로가 아닙니다.</small></div></section>
<div id="viewControls"><button id="zoomIn" aria-label="확대">＋</button><button id="zoomOut" aria-label="축소">−</button><button id="resetView">시점 초기화</button><button id="overview">지역 전체</button><button id="peopleButton" aria-pressed="true">사람 멈춤</button><button id="flatButton" aria-pressed="false">2D</button></div>
<nav id="datebar" class="glass" aria-label="여행 날짜"><button id="prevDay" aria-label="이전 날짜">←</button><div id="dates"></div><button id="nextDay" aria-label="다음 날짜">→</button></nav>
<p id="gestureHint">드래그: 회전 · 우클릭/두 손가락: 이동 · 휠/핀치: 확대 · 자체 제작 관광용 모형</p><div id="announcement" role="status" class="sr-only"></div>
<section id="tourBox" class="glass" hidden><div><b>자동 여행 둘러보기</b><button id="endTour">종료 ×</button></div><p id="tourPlace"></p><div class="tourActions"><button id="pauseTour">Ⅱ 일시정지</button><button id="nextStop">다음 장소 →</button><label>머무는 시간 <select id="dwell"><option value="6">6초</option><option value="10" selected>10초</option><option value="15">15초</option></select></label></div><progress id="tourProgress" max="1" value="0"></progress><small>선택한 날부터 마지막 날까지 · 직접 조작하면 자동 투어 일시정지</small></section>
<dialog id="guide"><div class="dialogHead"><h2>여행 안내 · 예약과 준비</h2><button id="closeGuide" aria-label="안내 닫기">×</button></div><div id="guideContent"></div></dialog><div id="printAll"></div><noscript><p class="noscript">인터랙티브 모형은 JavaScript가 필요합니다. <a href="../nyqc/">기존 일정 안내서</a>를 이용하세요.</p></noscript>
<script src="data.js"></script><script type="module" src="app.js?v=autoplay-1"></script><script type="module" src="music.js?v=autoplay-1"></script></body></html>
